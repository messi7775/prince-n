services:
  db:
    image: mariadb:11
    restart: on-failure
    environment:
      MYSQL_DATABASE: if0_43097781_prince
      MYSQL_USER: prince
      MYSQL_PASSWORD: prince_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    restart: on-failure
    ports:
      - "3000:80"
    environment:
      DB_HOST: db
      DB_NAME: if0_43097781_prince
      DB_USER: prince
      DB_PASS: prince_pass
      DB_PORT: "3306"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/login"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  dbdata:
